  - url: https://portal.tnb.org.tr/Sayfalar/MirascilikHiz.aspx
    institution: Türkiye Noterler Birliği
    title: Mirasçılık Belgesi
    process_codes: [mirascilik_belgesi, miras_arac_devri]

  - url: https://cdn.gib.gov.tr/api/gibportal-file/file/getFile?objectKey=PAGE%2FUNIVERSAL%2F2026%2F2026_VerasetveIntikal_Vergisi_Brosuru.pdf
    institution: Gelir İdaresi Başkanlığı
    title: Veraset ve İntikal Vergisi Broşürü (2026)
    process_codes: [mirascilik_belgesi, miras_arac_devri]

  - url: https://www.mevzuat.gov.tr/MevzuatMetin/1.5.7338.pdf
    institution: Mevzuat Bilgi Sistemi
    title: 7338 sayılı Veraset ve İntikal Vergisi Kanunu
    process_codes: [mirascilik_belgesi, miras_arac_devri]
    options:
      legislation: true

  # --- Mirasçılık belgesi ---
  - url: https://www.mevzuat.gov.tr/MevzuatMetin/1.5.4721.pdf
    institution: Mevzuat Bilgi Sistemi
    title: 4721 sayılı Türk Medeni Kanunu (yasal mirasçılar, mirasçılık belgesi)
    process_codes: [mirascilik_belgesi]
    options:
      legislation: true
      articles: ["495-501", "598"]

  - url: https://www.mevzuat.gov.tr/MevzuatMetin/1.5.1512.pdf
    institution: Mevzuat Bilgi Sistemi
    title: 1512 sayılı Noterlik Kanunu (mirasçılık belgesi)
    process_codes: [mirascilik_belgesi]
    options:
      legislation: true
      articles: ["71"]

  # --- Miras yoluyla araç devri ---
  - url: https://www.egm.gov.tr/trafik-tescil-hakkinda
