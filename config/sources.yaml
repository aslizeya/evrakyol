# Evrakyol kaynak yapılandırması
#
# allowed_domains: Veri yalnızca bu alan adlarından (ve alt alan adlarından) toplanır.
#   Listede olmayan bir adrese, yönlendirme yoluyla bile olsa, istek atılmaz.
# sources: Başlangıç kaynakları. `python -m app.ingest sync` ile veritabanına aktarılır.
#   Yönetici panelinden eklenen kaynaklar da aynı izin listesine tabidir.
#
# Kaynak seçenekleri (options):
#   legislation: true   -> Metin "Madde N" başlıklarına göre bölünür (kanun/yönetmelik).
#   articles: [...]     -> Sadece bu maddeler alınır. Örn. ["495-501", "598"].

user_agent: "EvrakyolBot/0.1 (+https://github.com/aslizeya/evrakyol)"
# Aynı sunucuya art arda iki istek arasındaki en kısa süre (saniye).
# robots.txt daha uzun bir Crawl-delay belirtirse o kullanılır.
min_delay_seconds: 3

# Bu ifadeleri içeren sayfalar kaynak olarak kabul edilmez (giriş ekranları vb.)
reject_patterns:
  - "Henüz kimliğinizi doğrulamadınız"
  - "kimlik doğrulama yöntemlerinden sizin için uygun olan"

allowed_domains:
  - domain: turkiye.gov.tr
    institution: e-Devlet Kapısı
  - domain: nvi.gov.tr
    institution: Nüfus ve Vatandaşlık İşleri Genel Müdürlüğü
  - domain: gib.gov.tr
    institution: Gelir İdaresi Başkanlığı
  - domain: btk.gov.tr
    institution: Bilgi Teknolojileri ve İletişim Kurumu
  - domain: mevzuat.gov.tr
    institution: Mevzuat Bilgi Sistemi
  - domain: resmigazete.gov.tr
    institution: Resmî Gazete
  - domain: egm.gov.tr
    institution: Emniyet Genel Müdürlüğü
  - domain: trafik.gov.tr
    institution: Emniyet Genel Müdürlüğü Trafik Başkanlığı
  - domain: adalet.gov.tr
    institution: Adalet Bakanlığı
  - domain: ticaret.gov.tr
    institution: Ticaret Bakanlığı
  # Kamu kurumu niteliğinde meslek kuruluşu (proje sahibi kararı, 2026-10-23)
  - domain: tnb.org.tr
    institution: Türkiye Noterler Birliği

sources:
