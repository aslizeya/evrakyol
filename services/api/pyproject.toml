[project]
name = "evrakyol-api"
version = "0.1.0"
description = "Evrakyol yapay zekâ servisi: veri toplama, indeksleme, RAG ve değerlendirme"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.1,<2.2",
    "psycopg[binary]>=3.2",
    "alembic>=1.20",
    "pgvector>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.17",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "RUF001", # Türkçe metinlerde belirsiz karakter uyarıları (ı, İ vb.) yanlış alarm üretir
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
# Yerel `alembic/` klasörü kütüphaneyle aynı adı taşıdığı için açıkça üçüncü taraf olarak işaretlenir.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: gerçek bir Postgres veritabanı gerektiren testler (DATABASE_URL)"]
