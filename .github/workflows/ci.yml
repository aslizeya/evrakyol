name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI'daki geçici test veritabanı (gizli bilgi değildir)
  DATABASE_URL: postgresql://evrakyol:evrakyol@localhost:5432/evrakyol

jobs:
  web:
    name: Web (lint, tip, test, derleme)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    name: API (ruff, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: evrakyol
          POSTGRES_PASSWORD: evrakyol
          POSTGRES_DB: evrakyol
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evrakyol -d evrakyol"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Testler (veritabanı testleri dahil)
        run: pytest -v

  database:
    name: Veritabanı (iki şemanın birlikte kurulumu)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: evrakyol
          POSTGRES_PASSWORD: evrakyol
          POSTGRES_DB: evrakyol
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evrakyol -d evrakyol"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: kb şeması (Alembic)
        working-directory: services/api
        run: |
          pip install -e .
          alembic upgrade head
      - name: app şeması (Prisma) ve başlangıç verisi
        working-directory: apps/web
        run: |
          npm ci
          npx prisma migrate deploy
          npm run db:seed
      - name: Prisma şeması ile migration'lar uyumlu mu?
        working-directory: apps/web
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Seed tekrar çalıştırılabilir mi (idempotent)?
        working-directory: apps/web
        run: npm run db:seed

  docker:
    name: Docker Compose doğrulama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile full config --quiet
      - run: docker build -f services/api/Dockerfile .
