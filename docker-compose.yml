# Yerel geliştirme ortamı.
#   docker compose up -d                 -> Postgres (pgvector), Redis ve API
#   docker compose --profile full up -d  -> + web uygulamasının üretim derlemesi
# Web geliştirmesi için genellikle `npm run dev` (apps/web) host üzerinde çalıştırılır.
name: evrakyol

x-db-url: &db-url postgresql://evrakyol:evrakyol@db:5432/evrakyol

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: evrakyol
      POSTGRES_PASSWORD: evrakyol
      POSTGRES_DB: evrakyol
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evrakyol -d evrakyol"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379/0
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./services/api/app:/app/app
      - ./config:/config:ro
      - model-cache:/home/evrakyol/.cache
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: *db-url
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  db-data:
  model-cache:
